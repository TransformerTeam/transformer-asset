[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/TestData/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "text/csv; charset=utf-8"
    Cache-Control = "public, max-age=3600"
